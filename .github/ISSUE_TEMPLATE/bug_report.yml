name: Bug Report
description: Report a bug to help us improve
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the fields below with as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? Provide a clear and concise description of the bug.
      placeholder: Describe the issue you ran into...
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: Which browser were you using when you encountered this bug?
      options:
        - Firefox
        - Edge
        - Chrome
        - Other
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: List the steps needed to reproduce the bug.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected-result
    attributes:
      label: Expected Result
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual-result
    attributes:
      label: Actual Result
      description: What actually happened instead?
    validations:
      required: true

  - type: textarea
    id: console-logs
    attributes:
      label: Console Log Output
      description: Paste any relevant browser console output. This will be automatically formatted as code.
      render: shell
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, drag and drop screenshots or a screen recording here to help explain the problem.
    validations:
      required: false
