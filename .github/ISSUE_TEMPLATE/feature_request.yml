name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature! Please fill out the fields below with as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What feature would you like to see added?
      placeholder: Describe the feature you're requesting...
    validations:
      required: true

  - type: textarea
    id: explanation
    attributes:
      label: Explanation
      description: Why do you think this would be a good feature? What problem does it solve or value does it add?
      placeholder: Explain the motivation and benefit behind this request...
    validations:
      required: true
